# Copy into a repository that has vitest-impact installed as a dev dependency.
# Keep full-suite gates while evaluating selection. Shadow runs every test.
# This example is for a workspace. For a single package, drop --filter (it needs a workspace).
name: Test impact observation
on:
  pull_request:
permissions:
  contents: read
jobs:
  shadow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: actions/cache@v4
        with:
          path: .vitest-impact/cache
          key: vitest-impact-${{ runner.os }}-${{ hashFiles('**/package-lock.json', '**/pnpm-lock.yaml', '**/yarn.lock', 'vitest-impact.config.json', '**/vitest.config.*', '**/vite.config.*') }}
      - name: Observe selection against the full suite
        run: npx --no-install vitest-impact run --base "$IMPACT_BASE" --mode shadow --filter '!./tools/*'
        env:
          IMPACT_BASE: ${{ github.event.pull_request.base.sha }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vitest-impact
          path: .vitest-impact/
          include-hidden-files: true
