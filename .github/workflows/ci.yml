name: Verify MVP
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
        vitest: [4.0.18, 4.1.7, 5.0.5]
    env:
      # The fixtures run on this Vitest; 5.0.5 is the checkout's own.
      VITEST_IMPACT_FIXTURE_VITEST: ${{ matrix.vitest != '5.0.5' && format('.vitest-versions/{0}', matrix.vitest) || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      # --legacy-peer-deps: without it npm 10 stops with "Cannot read properties of null (reading 'edgesOut')" on vitest 4.1.7.
      - if: matrix.vitest != '5.0.5'
        run: npm install --prefix .vitest-versions/${{ matrix.vitest }} vitest@${{ matrix.vitest }} --legacy-peer-deps
      # A broken VITEST_IMPACT_FIXTURE_VITEST would run the fixtures on 5.0.5 and stay green.
      - name: Fixtures use Vitest ${{ matrix.vitest }}
        run: |
          node --input-type=module -e 'const { fixtureVitest } = await import("./scripts/fixture.mjs"); if (fixtureVitest !== process.argv[1]) throw new Error(`Fixtures use Vitest ${fixtureVitest}, not ${process.argv[1]}`)' ${{ matrix.vitest }}
      - run: npm run check
      - run: npm run demo
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: demo-reports-node-${{ matrix.node }}-vitest-${{ matrix.vitest }}
          path: .vitest-impact/demo/
          include-hidden-files: true
