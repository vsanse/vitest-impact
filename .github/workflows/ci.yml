name: Verify MVP
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run demo
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: demo-reports-node-${{ matrix.node }}
          path: .vitest-impact/demo/
          include-hidden-files: true
